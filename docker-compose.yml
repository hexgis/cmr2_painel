services:
    web:
        image: gcr.io/custom-plating-209314/skyviewer:feature-homolog
        build:
            context: .
            args:
                stage: build
        ports:
            - '8000:80'
        command: "nginx -g 'daemon off;'"
        restart: always

    dev:
        build:
            context: .
            dockerfile: Dockerfile-dev # This will now use the 'dev' stage by default
        command: sh -c "npm install && npm run dev"
        ports:
            - '3000:3000'
        volumes:
            - .:/app/
            - node_modules:/app/node_modules
            - /app/.nuxt
        environment:
            HOST: 0.0.0.0

volumes:
    node_modules:

